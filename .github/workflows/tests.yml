name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock python-dotenv pydantic requests groq numpy \
            scikit-learn rank_bm25 chromadb pymupdf python-docx "langfuse>=2,<3"
      - name: Run unit tests
        run: pytest -q
